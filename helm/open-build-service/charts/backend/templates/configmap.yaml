apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}-config
  labels:
    {{- include "backend.labels" . | nindent 4 }}
data:
  BSConfig.local.pm: {{
      printf "%s\n%s\n1;\n" "$ipaccess->{\".*\"} = \"rw,worker\";" (
        default "" .Values.global.backend.extraConfig
      ) | quote
    }}
  aptly.conf: {{ default "" .Values.global.backend.aptly | toPrettyJson | quote }}
