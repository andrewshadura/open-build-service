{{- $arches := default
  (list "x86_64" "i586" "armv7hl" "aarch64")
  .Values.global.backend.architectures
-}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "backend.fullname" . }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $services := dict
        "repserver" (dict
          "port" 5252
        )
        "srcserver" (dict
          "port" 5352
          "probePort" 5252
        )
        "dispatcher" (dict
          "exec" "bs_dispatch"
        )
        "dodup" (dict)
        "publisher" (dict
          "exec" "bs_publish"
          "probePort" 5352
        )
        "warden" (dict)
        "servicedispatch" (dict)
        "deltastore" (dict)
        "srcservice" (dict
          "exec" "bs_service"
          "port" 5152
        )
        "clouduploader" (dict
          "exec" "bs_clouduploadserver"
          "port" 5452
        )
      }}
      {{- range $arch := $arches }}
      {{-   $services = merge $services (dict
          (printf "scheduler-%s" (kebabcase $arch)) (dict
            "exec" (printf "bs_sched %s" $arch)
            "probePort" 5352
          )
      ) }}
      {{- end }}
      containers:
        {{- range $container, $args := $services }}
        - name: {{ $container }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: OBS_TRUST_PRIVATE_NET
              value: '1'
            - name: OBS_BACKEND_HOST
              value: {{ include "backend.fullname" $ | quote }}
            - name: OBS_FRONTEND_HOST
              value: {{ include "frontend.hostname" $ | quote }}
            - name: OBS_ARCHES
              value: {{ $arches | join " " | quote }}
          {{- $command := get $args "exec" | default (printf "bs_%s" $container) }}
          {{- if not (hasPrefix $command "/") }}
          {{- $command = printf "/usr/lib/obs/server/%s" $command }}
          {{- end }}
          command:
            - /bin/sh
            - -c
          {{- if get $args "probePort" }}
          startupProbe:
            httpGet:
              path: /
              port: {{ get $args "probePort" }}
            failureThreshold: 10
            periodSeconds: 3
          args:
            - |
              echo Waiting for port {{ get $args "probePort" }} to become available
              curl --silent --fail --show-error --max-time 20 --retry 20 --retry-delay 5 --retry-all-errors --retry-max-time 120 127.0.0.1:{{ get $args "probePort" }}
              echo Starting {{ $container }}
              {{ $command }}
          {{- else }}
          args:
            - |
              {{ $command }}
          {{- end }}
          {{- if get $args "port" }}
          ports:
            - name: {{ $container }}
              containerPort: {{ get $args "port" }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: {{ $container }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ $container }}
          {{- end }}
          volumeMounts:
            - name: backend
              mountPath: /srv/obs
              subPath: data
            - name: backend
              mountPath: /etc/obs
              subPath: config
            - name: backend-logs
              mountPath: /srv/obs/log
            - name: backend-extraconfig
              mountPath: /etc/obs/BSConfig.local.pm
              subPath: BSConfig.local.pm
        {{- end }}
      volumes:
        - name: backend
          {{- if $.Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $.Values.persistence.existingClaim | default (printf "%s-storage" (include "backend.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: backend-logs
          emptyDir: {}
        - name: backend-extraconfig
          configMap:
            name: {{ include "backend.fullname" $ }}-config
            optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      resources:
        {{- toYaml $.Values.resources | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
