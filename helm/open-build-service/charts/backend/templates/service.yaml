apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5252
      targetPort: repserver
      protocol: TCP
      name: repserver
    - port: 5352
      targetPort: srcserver
      protocol: TCP
      name: srcserver
  selector:
    {{- include "backend.selectorLabels" . | nindent 4 }}
