[program:aptly]
command=/usr/local/bin/aptly -config=/etc/obs/aptly.conf api serve -no-lock
directory=/usr/lib/obs/server/
user=obsrun
stdout_logfile=/srv/obs/log/aptly.log
redirect_stderr=true
autostart=True
priority=1
startretries=100
stopsignal=KILL
killasgroup=true
stopasgroup=true
#environment=GIN_MODE=release
