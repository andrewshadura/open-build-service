version: "2.1"

services:
  db:
    image: mariadb:10.6
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: someobs
      MARIADB_DATABASE: obsapi
      MARIADB_USER: obs-api
      MARIADB_PASSWORD: someobs

  cache:
    image: memcached:1.6-alpine

  aptly:
    image: registry.gitlab.collabora.com/obs/aptly-repository/aptly
    hostname: aptly
    restart: unless-stopped
    volumes:
      - aptly-storage:/aptly/data
    expose:
      - '8080'
    ports:
      # Expose on port 8088, because 8080 is already taken by the backend.
      - "127.0.0.1:8088:8080"

  backend:
    image: registry.gitlab.collabora.com/obs/open-build-service/backend
    hostname: backend
    restart: unless-stopped
    volumes:
      - backend-storage:/srv/obs
      - backend-logs:/srv/obs/log
    environment:
      OBS_FRONTEND_HOST: frontend
      OBS_BACKEND_HOST: backend
      OBS_TRUST_PRIVATE_NET: 'yes'
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    image: registry.gitlab.collabora.com/obs/open-build-service/frontend
    volumes:
      - frontend-logs:/obs/src/api/log
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 4G
    hostname: frontend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_ROOT_PASSWORD: someobs
      DB_NAME: obsapi
      DB_USER: obs-api
      DB_PASSWORD: someobs
      OBS_BACKEND_HOST: backend
      OBS_EXTERNAL_HOST: build.example.org
      OBS_MEMCACHE_HOST: cache
      OBS_FRONTEND_WORKERS: 4
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
      - db
      - cache

  worker:
    depends_on:
      - backend
    image: registry.gitlab.collabora.com/obs/open-build-service/worker
    hostname: worker
    restart: unless-stopped
    privileged: true
    volumes:
      - worker-logs:/srv/obs/log
    environment:
      OBS_SRC_SERVER: backend:5352
      OBS_REPO_SERVERS: backend:5252
      OBS_WORKER_INSTANCES: 1

volumes:
  aptly-storage:
  backend-storage:
  backend-logs:
  frontend-logs:
  worker-logs:
