stages:
  - sanity-check
  - docker
  - test
  - tag

variables:
  TAG_SHA: $CI_COMMIT_SHORT_SHA-P$CI_PIPELINE_ID
  GIT_SUBMODULE_STRATEGY: recursive

check-vendored:
  stage: sanity-check
  tags:
    - lightweight
  image: debian:bookworm-slim
  script:
    - |
      test ! -d src/api/vendor/cache || (
        echo 'Vendored gems detected, aborting build'
        false
      )

.build-docker-image:
  stage: docker
  tags:
    - lightweight
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - |
      cat << EOF > /kaniko/.docker/config.json
      {
        "auths":{
          "$CI_REGISTRY": {
            "username":"$CI_REGISTRY_USER",
            "password":"$CI_REGISTRY_PASSWORD"
          }
        }
      }
      EOF
    - >
      /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile.$image
      --destination $CI_REGISTRY_IMAGE/$image:$TAG_SHA
      --destination $CI_REGISTRY_IMAGE/$image:$CI_COMMIT_REF_SLUG
      --build-arg REGISTRY=$CI_REGISTRY_IMAGE
      --build-arg TAG=$CI_COMMIT_REF_SLUG
      --single-snapshot
    - echo Pushed $CI_REGISTRY_IMAGE/$image:$CI_COMMIT_REF_SLUG
              and $CI_REGISTRY_IMAGE/$image:$TAG_SHA

frontend-base:
  extends: .build-docker-image
  only:
    changes:
      - Dockerfile.frontend-base
      - src/api/app/assets
      - src/api/public
      - src/api/vendor
      - src/api/Gemfile
      - src/api/Gemfile.lock
  variables:
    image: frontend-base

frontend:
  extends: .build-docker-image
  needs:
    - job: frontend-base
      optional: true
  variables:
    image: frontend

backend:
  extends: .build-docker-image
  variables:
    image: backend

worker:
  extends: .build-docker-image
  needs:
    - job: backend
  variables:
    image: worker

.boot-instance:
  image: debian:bookworm-slim
  tags:
    - heavyweight
  services:
    - name: docker:stable-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    COMPOSE_OVERLAY: |
      version: '2.1'
      services:
        frontend:
          image: $CI_REGISTRY_IMAGE/frontend:$TAG_SHA
          ports:
            - "80:3000"
          environment:
            OBS_LOG_LEVEL: debug
        backend:
          image: $CI_REGISTRY_IMAGE/backend:$TAG_SHA
          ports:
            - "5252:5252"
        worker:
          image: $CI_REGISTRY_IMAGE/worker:$TAG_SHA
      volumes:
        backend-storage:
          driver_opts:
            type: none
            o: bind
            device: './storage/backend'
        backend-logs:
          driver_opts:
            type: none
            o: bind
            device: './logs/backend'
        frontend-logs:
          driver_opts:
            type: none
            o: bind
            device: './logs/frontend'
        worker-logs:
          driver_opts:
            type: none
            o: bind
            device: './logs/worker'
  before_script:
    - apt update && apt install -y --no-install-recommends
        curl
        debhelper
        docker-compose
        docker.io
        dpkg-dev
        equivs
        osc
        osc-plugin-dput
        wait-for-it
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker info
    - echo "$COMPOSE_OVERLAY" > docker-compose.override.yml
    - mkdir -p logs/backend logs/frontend logs/worker storage/backend
    - |
      cat << EOF > ~/.oscrc
      [general]
      apiurl = http://docker
      [http://docker]
      user = Admin
      pass = opensuse
      EOF
    - docker-compose up -d
    - wait-for-it docker:5252 -s --timeout=180 -- echo "The OBS backend is up"
    - wait-for-it docker:80 -s --timeout=180 -- echo "The OBS frontend is up"
    - PATH=$PWD/tests/scripts:$PATH
  after_script:
    - docker-compose logs > docker-compose.txt
  artifacts:
    paths:
      - docker-compose.txt
      - logs/*/*.log
    when: always

integration-test:
  stage: test
  extends: .boot-instance
  script:
    - curl http://docker/
    - osc ls /
    - run-parts tests

tag-latest-docker-image:
  stage: tag
  tags:
    - lightweight
  image: buildah/buildah
  variables:
    AUTH: $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD
    TAG_NEW: latest
  script:
    - |
      for image in frontend backend worker
      do
        echo Tagging "$CI_REGISTRY_IMAGE/$image:$TAG_SHA"
        skopeo copy --src-creds "$AUTH" --dest-creds "$AUTH" \
            "docker://$CI_REGISTRY_IMAGE/$image:$TAG_SHA" \
            "docker://$CI_REGISTRY_IMAGE/$image:$TAG_NEW"
        echo Tagged "$CI_REGISTRY_IMAGE/$image:$TAG_NEW"
      done
  only:
    variables:
      - $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH
